{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply the saved (or system) colour theme before first paint to avoid a flash.
     Kept comment-free with explicit semicolons: the HTML compressor joins lines. -->
<script>
  (function () { try { var t = localStorage.getItem("theme"); if (t !== "dark" && t !== "light") { t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } if (t === "dark") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();
</script>

<!-- Fonts: Space Grotesk (headings), Inter (text), JetBrains Mono (labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Site design system (loaded after main.css so it can override the template) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css?v={{ site.time | date: '%s' }}">

<!-- Tab icon: a digital-twin cube (solid physical side, wireframe digital side) on the brand gradient.
     images/favicon.svg is the source; the .ico and .png files are exported from it.
     Bump ?v= after replacing the icons so browsers drop their cached copy. -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=2" sizes="32x32"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2"/>
<meta name="theme-color" content="#070d1a"/>

<!-- end custom head snippets -->
