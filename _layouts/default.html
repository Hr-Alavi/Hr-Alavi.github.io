---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="layout--{{ page.layout | default: 'default' }}{% if page.url == '/' %} is-home{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <button class="to-top" type="button" data-to-top aria-label="Back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>

    {% include scripts.html %}
  </body>
</html>
